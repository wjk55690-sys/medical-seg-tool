<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>医学图像病灶分割标注系统</title>
<style>
body{margin:0;font-family:"Microsoft YaHei",Arial;background:#f5f5f5}
.top-bar{height:80px;background:#fafafa;border-bottom:1px solid #ddd;display:flex;align-items:center;padding:0 24px;gap:12px}
.timer{font-size:24px;font-weight:bold;background:#f1f1eb;border:1px solid #ddd;padding:10px 18px;border-radius:10px;min-width:80px;text-align:center}
button{font-size:18px;padding:12px 24px;border:1px solid #bbb;background:white;border-radius:10px;cursor:pointer}
button:hover{background:#f0f0f0}
.main{display:flex;height:calc(100vh - 80px)}
.canvas-area{flex:1;background:#111;overflow:auto;position:relative}
.canvas-center{min-width:100%;min-height:100%;display:flex;justify-content:center;align-items:center}
.canvas-wrapper{position:relative;display:inline-block}
canvas{position:absolute;top:0;left:0}
#imageCanvas{position:relative;background:#111}
#maskCanvas{cursor:crosshair}
#overlayCanvas{pointer-events:none}
.empty-tip{color:#777;font-size:18px;text-align:center}
.side-bar{width:300px;background:#fff;border-left:1px solid #ddd;padding:20px;box-sizing:border-box;overflow-y:auto}
.section{border-bottom:1px solid #ddd;padding-bottom:18px;margin-bottom:18px}
.section-title{font-size:18px;margin-bottom:12px;color:#555}
.tool-btn{width:100%;margin-bottom:8px;text-align:left}
.tool-btn.active{background:#e8f0ff;border-color:#4a80f0}
.color-row{display:flex;gap:10px;flex-wrap:wrap}
.color-dot{width:28px;height:28px;border-radius:50%;border:2px solid transparent;cursor:pointer}
.color-dot.active{border:3px solid #111}
input[type="range"]{width:100%}
.file-name{font-size:15px;background:#f6f6f6;border:1px solid #ddd;padding:8px;border-radius:6px;word-break:break-all}
.bottom-zoom{position:fixed;right:330px;bottom:20px;width:260px;background:rgba(255,255,255,.96);border:1px solid #ccc;border-radius:12px;padding:12px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
</style>
</head>

<body>
<div class="top-bar">
    <div class="timer" id="timer">00:00</div>
    <button onclick="startTimer()">开始</button>
    <button onclick="pauseTimer()">暂停</button>
    <button onclick="resetAll()">重置</button>

    <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="loadImage()">
    <button onclick="document.getElementById('fileInput').click()">加载图像</button>

    <button onclick="undo()">返回</button>
    <button onclick="clearMask()">清除全部</button>
    <button onclick="saveAll()">保存掩码</button>
    <button onclick="submitMask()">提交</button>
</div>

<div class="main">
    <div class="canvas-area" id="canvasArea">
        <div class="canvas-center">
            <div id="emptyTip" class="empty-tip">
                <p>加载医学图像开始标注</p>
                <p>支持 PNG / JPG / JPEG / BMP / TIFF</p>
            </div>

            <div class="canvas-wrapper" id="canvasWrapper" style="display:none;">
                <canvas id="imageCanvas"></canvas>
                <canvas id="maskCanvas"></canvas>
                <canvas id="overlayCanvas"></canvas>
            </div>
        </div>
    </div>

    <div class="side-bar">
        <div class="section">
            <div class="section-title">当前图像</div>
            <div class="file-name" id="fileName">未加载图像</div>
        </div>

        <div class="section">
            <div class="section-title">绘制工具</div>
            <button class="tool-btn active" id="drawBtn" onclick="setTool('draw')">自由绘制</button>
            <button class="tool-btn" id="polygonBtn" onclick="setTool('polygon')">多边形勾边</button>
            <button class="tool-btn" id="eraseBtn" onclick="setTool('erase')">橡皮擦</button>
        </div>

        <div class="section">
            <div class="section-title">颜色</div>
            <div class="color-row">
                <div class="color-dot active" style="background:#ff4d4f" onclick="setColor('#ff4d4f',this)"></div>
                <div class="color-dot" style="background:#fa8c16" onclick="setColor('#fa8c16',this)"></div>
                <div class="color-dot" style="background:#fadb14" onclick="setColor('#fadb14',this)"></div>
                <div class="color-dot" style="background:#52c41a" onclick="setColor('#52c41a',this)"></div>
                <div class="color-dot" style="background:#1677ff" onclick="setColor('#1677ff',this)"></div>
                <div class="color-dot" style="background:#9254de" onclick="setColor('#9254de',this)"></div>
            </div>
        </div>

        <div class="section">
            <div class="section-title">笔刷大小：<span id="brushText">8</span>px</div>
            <input type="range" min="1" max="80" value="8" oninput="changeBrush(this.value)">
        </div>

        <div class="section">
            <div class="section-title">透明度：<span id="alphaText">60</span>%</div>
            <input type="range" min="10" max="100" value="60" oninput="changeAlpha(this.value)">
        </div>

        <div class="section">
            <div class="section-title">掩码信息</div>
            <p>已标注像素：<b id="pixelCount">0</b></p>
            <p>掩码命名：<span id="maskName">—</span></p>
            <p>信息文件：<span id="infoName">—</span></p>
        </div>
    </div>
</div>

<div class="bottom-zoom">
    <div>图像缩放：<span id="zoomText">100</span>%</div>
    <input type="range" min="50" max="300" value="100" id="zoomSlider" oninput="changeZoom(this.value)">
</div>

<script>
const imageCanvas=document.getElementById("imageCanvas");
const maskCanvas=document.getElementById("maskCanvas");
const overlayCanvas=document.getElementById("overlayCanvas");

const imgCtx=imageCanvas.getContext("2d");
const maskCtx=maskCanvas.getContext("2d");
const overlayCtx=overlayCanvas.getContext("2d");

let currentImage=null,currentFileName="",originalWidth=0,originalHeight=0;
let drawing=false,tool="draw",brushSize=8,drawColor="#ff4d4f",alpha=0.6,zoom=1.0;
let historyStack=[],timer=null,startTime=null,elapsed=0;
let annotationStartDate=null,annotationEndDate=null;
let lastMouseX=0,lastMouseY=0;

let polygonPoints=[];
let polygonHover=null;

function formatTime(seconds){const m=Math.floor(seconds/60),s=Math.floor(seconds%60);return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0")}
function formatDate(date){if(!date) return "";const y=date.getFullYear(),mo=String(date.getMonth()+1).padStart(2,"0"),d=String(date.getDate()).padStart(2,"0"),h=String(date.getHours()).padStart(2,"0"),mi=String(date.getMinutes()).padStart(2,"0"),s=String(date.getSeconds()).padStart(2,"0");return `${y}-${mo}-${d} ${h}:${mi}:${s}`}

function startTimer(){if(!currentImage){alert("请先加载图像");return}if(timer)return;if(!annotationStartDate)annotationStartDate=new Date();startTime=Date.now()-elapsed*1000;timer=setInterval(()=>{elapsed=(Date.now()-startTime)/1000;document.getElementById("timer").innerText=formatTime(elapsed)},200)}
function pauseTimer(){if(timer){clearInterval(timer);timer=null}}
function stopTimer(){if(timer){clearInterval(timer);timer=null}}

function loadImage(){
    const file=document.getElementById("fileInput").files[0]; if(!file) return;
    currentFileName=file.name;
    document.getElementById("fileName").innerText=currentFileName;
    const baseName=getBaseName(currentFileName);
    document.getElementById("maskName").innerText=baseName+"_mask.png";
    document.getElementById("infoName").innerText=baseName+"_info.txt";

    const reader=new FileReader();
    reader.onload=e=>{
        const img=new Image();
        img.onload=()=>{
            currentImage=img; originalWidth=img.width; originalHeight=img.height;
            zoom=1.0; document.getElementById("zoomSlider").value=100; document.getElementById("zoomText").innerText=100;
            document.getElementById("emptyTip").style.display="none";
            document.getElementById("canvasWrapper").style.display="inline-block";

            historyStack=[]; elapsed=0; annotationStartDate=null; annotationEndDate=null;
            polygonPoints=[]; polygonHover=null;
            document.getElementById("timer").innerText="00:00"; stopTimer();

            resizeCanvas(true); clearMask(); clearOverlay(); startTimer();
        };
        img.src=e.target.result;
    };
    reader.readAsDataURL(file);
}

function getBaseName(filename){const idx=filename.lastIndexOf(".");return idx===-1?filename:filename.substring(0,idx)}

function resizeCanvas(firstLoad=false){
    const oldMask=document.createElement("canvas");
    oldMask.width=maskCanvas.width; oldMask.height=maskCanvas.height;
    if(maskCanvas.width>0&&maskCanvas.height>0) oldMask.getContext("2d").drawImage(maskCanvas,0,0);

    const w=Math.floor(originalWidth*zoom), h=Math.floor(originalHeight*zoom);
    imageCanvas.width=w; imageCanvas.height=h;
    maskCanvas.width=w; maskCanvas.height=h;
    overlayCanvas.width=w; overlayCanvas.height=h;

    const wrapper=document.getElementById("canvasWrapper");
    wrapper.style.width=w+"px"; wrapper.style.height=h+"px";

    imgCtx.clearRect(0,0,w,h); imgCtx.drawImage(currentImage,0,0,w,h);
    if(!firstLoad && oldMask.width>0 && oldMask.height>0) maskCtx.drawImage(oldMask,0,0,w,h);
    maskCanvas.style.opacity=alpha;
    redrawPolygonOverlay();
}

function changeZoom(value){
    if(!currentImage) return;
    const canvasArea=document.getElementById("canvasArea");
    const oldZoom=zoom, oldW=originalWidth*oldZoom, oldH=originalHeight*oldZoom;
    let mouseRatioX=lastMouseX/oldW, mouseRatioY=lastMouseY/oldH;
    if(!isFinite(mouseRatioX)) mouseRatioX=0.5; if(!isFinite(mouseRatioY)) mouseRatioY=0.5;

    zoom=Number(value)/100; document.getElementById("zoomText").innerText=value;
    resizeCanvas(false);

    const newW=originalWidth*zoom, newH=originalHeight*zoom;
    const targetX=mouseRatioX*newW, targetY=mouseRatioY*newH;
    canvasArea.scrollLeft=targetX-canvasArea.clientWidth/2;
    canvasArea.scrollTop=targetY-canvasArea.clientHeight/2;
}

function setTool(t){
    tool=t;
    document.getElementById("drawBtn").classList.remove("active");
    document.getElementById("polygonBtn").classList.remove("active");
    document.getElementById("eraseBtn").classList.remove("active");

    if(t==="draw") document.getElementById("drawBtn").classList.add("active");
    if(t==="polygon") document.getElementById("polygonBtn").classList.add("active");
    if(t==="erase") document.getElementById("eraseBtn").classList.add("active");

    if(t!=="polygon"){polygonPoints=[]; polygonHover=null; clearOverlay();}
}

function setColor(color,el){drawColor=color;document.querySelectorAll(".color-dot").forEach(e=>e.classList.remove("active"));el.classList.add("active");redrawPolygonOverlay()}
function changeBrush(value){brushSize=Number(value);document.getElementById("brushText").innerText=value}
function changeAlpha(value){alpha=Number(value)/100;document.getElementById("alphaText").innerText=value;maskCanvas.style.opacity=alpha}

function getMousePos(e){const rect=maskCanvas.getBoundingClientRect();return{x:e.clientX-rect.left,y:e.clientY-rect.top}}

maskCanvas.addEventListener("mousedown",e=>{
    if(!currentImage) return;
    const pos=getMousePos(e); lastMouseX=pos.x; lastMouseY=pos.y;

    if(tool==="polygon"){
        if(e.button===2) return;
        if(e.detail===2){ finalizePolygon(); return; }
        polygonPoints.push(pos); polygonHover=pos; redrawPolygonOverlay(); return;
    }

    drawing=true; saveHistory(); draw(pos.x,pos.y);
});

maskCanvas.addEventListener("mousemove",e=>{
    const pos=getMousePos(e); lastMouseX=pos.x; lastMouseY=pos.y;
    if(tool==="polygon"){
        polygonHover=pos;
        if(polygonPoints.length>0) redrawPolygonOverlay();
        return;
    }
    if(!drawing) return;
    draw(pos.x,pos.y);
});

maskCanvas.addEventListener("mouseup",()=>{drawing=false;updatePixelCount()});
maskCanvas.addEventListener("mouseleave",()=>{drawing=false});
maskCanvas.addEventListener("contextmenu",e=>{ if(tool==="polygon"){ e.preventDefault(); polygonPoints=[]; polygonHover=null; clearOverlay(); } });

maskCanvas.addEventListener("wheel",function(e){
    if(!currentImage) return;
    e.preventDefault();
    const pos=getMousePos(e); lastMouseX=pos.x; lastMouseY=pos.y;
    const slider=document.getElementById("zoomSlider");
    let currentValue=Number(slider.value);
    currentValue += (e.deltaY<0?10:-10);
    currentValue=Math.max(50,Math.min(300,currentValue));
    slider.value=currentValue; changeZoom(currentValue);
},{passive:false});

window.addEventListener("keydown",e=>{
    if(tool==="polygon" && e.key==="Escape"){ polygonPoints=[]; polygonHover=null; clearOverlay(); }
});

function draw(x,y){
    maskCtx.globalAlpha=1.0; maskCtx.lineCap="round"; maskCtx.lineJoin="round";
    if(tool==="draw"){ maskCtx.globalCompositeOperation="source-over"; maskCtx.fillStyle=drawColor; }
    else{ maskCtx.globalCompositeOperation="destination-out"; maskCtx.fillStyle="rgba(0,0,0,1)"; }
    maskCtx.beginPath(); maskCtx.arc(x,y,brushSize,0,Math.PI*2); maskCtx.fill();
    maskCtx.globalCompositeOperation="source-over";
}

function clearOverlay(){ overlayCtx.clearRect(0,0,overlayCanvas.width,overlayCanvas.height) }

function redrawPolygonOverlay(){
    clearOverlay();
    if(polygonPoints.length===0) return;

    overlayCtx.strokeStyle=drawColor;
    overlayCtx.fillStyle=drawColor;
    overlayCtx.lineWidth=2;

    overlayCtx.beginPath();
    overlayCtx.moveTo(polygonPoints[0].x, polygonPoints[0].y);
    for(let i=1;i<polygonPoints.length;i++) overlayCtx.lineTo(polygonPoints[i].x, polygonPoints[i].y);
    if(polygonHover) overlayCtx.lineTo(polygonHover.x, polygonHover.y);
    overlayCtx.stroke();

    for(const p of polygonPoints){
        overlayCtx.beginPath();
        overlayCtx.arc(p.x,p.y,4,0,Math.PI*2);
        overlayCtx.fill();
    }
}

function finalizePolygon(){
    if(polygonPoints.length<3) return;
    saveHistory();

    maskCtx.globalCompositeOperation="source-over";
    maskCtx.fillStyle=drawColor;
    maskCtx.beginPath();
    maskCtx.moveTo(polygonPoints[0].x, polygonPoints[0].y);
    for(let i=1;i<polygonPoints.length;i++) maskCtx.lineTo(polygonPoints[i].x, polygonPoints[i].y);
    maskCtx.closePath();
    maskCtx.fill();

    polygonPoints=[]; polygonHover=null; clearOverlay(); updatePixelCount();
}

function saveHistory(){const data=maskCtx.getImageData(0,0,maskCanvas.width,maskCanvas.height);historyStack.push(data);if(historyStack.length>30)historyStack.shift()}
function undo(){if(historyStack.length===0){alert("没有可返回的操作");return}const data=historyStack.pop();maskCtx.putImageData(data,0,0);updatePixelCount()}
function clearMask(){if(!currentImage)return;maskCtx.clearRect(0,0,maskCanvas.width,maskCanvas.height);updatePixelCount()}
function resetAll(){if(!currentImage)return;clearMask();historyStack=[];elapsed=0;annotationStartDate=null;annotationEndDate=null;polygonPoints=[];polygonHover=null;clearOverlay();document.getElementById("timer").innerText="00:00";stopTimer()}
function updatePixelCount(){if(!currentImage)return;const imageData=maskCtx.getImageData(0,0,maskCanvas.width,maskCanvas.height).data;let count=0;for(let i=3;i<imageData.length;i+=4)if(imageData[i]>0)count++;document.getElementById("pixelCount").innerText=count}

function getBinaryMaskCanvas(){
    const tempCanvas=document.createElement("canvas");
    tempCanvas.width=originalWidth; tempCanvas.height=originalHeight;
    const tempCtx=tempCanvas.getContext("2d");
    tempCtx.drawImage(maskCanvas,0,0,originalWidth,originalHeight);
    const imageData=tempCtx.getImageData(0,0,originalWidth,originalHeight), data=imageData.data;
    for(let i=0;i<data.length;i+=4){
        const value=data[i+3]>0?255:0;
        data[i]=value; data[i+1]=value; data[i+2]=value; data[i+3]=255;
    }
    tempCtx.putImageData(imageData,0,0);
    return tempCanvas;
}

function getMaskPixelCount(){
    const temp=getBinaryMaskCanvas().getContext("2d").getImageData(0,0,originalWidth,originalHeight).data;
    let count=0; for(let i=0;i<temp.length;i+=4) if(temp[i]>0) count++;
    return count;
}

function downloadMaskFile(){
    const maskCanvasOut=getBinaryMaskCanvas();
    const maskName=getBaseName(currentFileName)+"_mask.png";
    const link=document.createElement("a");
    link.download=maskName; link.href=maskCanvasOut.toDataURL("image/png");
    document.body.appendChild(link); link.click(); document.body.removeChild(link);
}

function downloadInfoFile(){
    const baseName=getBaseName(currentFileName), maskName=baseName+"_mask.png", infoName=baseName+"_info.txt";
    const maskPixels=getMaskPixelCount(), totalPixels=originalWidth*originalHeight;
    const maskRatio=totalPixels>0?(maskPixels/totalPixels*100).toFixed(4):"0.0000";
    if(!annotationEndDate) annotationEndDate=new Date();

    const content=`Original Image: ${currentFileName}
Mask Image: ${maskName}
Info File: ${infoName}

Start Time: ${formatDate(annotationStartDate)}
End Time: ${formatDate(annotationEndDate)}
Elapsed Time: ${elapsed.toFixed(2)} seconds

Image Width: ${originalWidth}
Image Height: ${originalHeight}
Image Size: ${originalWidth} x ${originalHeight}

Mask Pixels: ${maskPixels}
Total Pixels: ${totalPixels}
Mask Ratio: ${maskRatio}%
`;

    const blob=new Blob([content],{type:"text/plain;charset=utf-8"});
    const url=URL.createObjectURL(blob);
    const link=document.createElement("a");
    link.download=infoName; link.href=url;
    document.body.appendChild(link); link.click(); document.body.removeChild(link);
    setTimeout(()=>URL.revokeObjectURL(url),1000);
}

function saveAll(){
    if(!currentImage){alert("请先加载图像");return}
    annotationEndDate=new Date();
    downloadMaskFile();
    setTimeout(()=>downloadInfoFile(),500);
}

function submitMask(){
    if(!currentImage){alert("请先加载图像");return}
    annotationEndDate=new Date(); stopTimer();
    downloadMaskFile();
    setTimeout(()=>{
        downloadInfoFile();
        alert("提交完成\n用时："+formatTime(elapsed)+"\n掩码文件名："+getBaseName(currentFileName)+"_mask.png\n信息文件名："+getBaseName(currentFileName)+"_info.txt");
    },500);
}
</script>
</body>
</html>
